version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: db_postgres
    restart: always
    environment:
      POSTGRES_USER: ebraimsambo
      POSTGRES_PASSWORD: Deezycheezy@2
      POSTGRES_DB: statemen3
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  springboot-app:
    build: .
    container_name: spring_app
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/statemen3
      SPRING_DATASOURCE_USERNAME: ebraimsambo
      SPRING_DATASOURCE_PASSWORD: Deezycheezy@2
    ports:
      - "8082:8082"
    restart: always

volumes:
  postgres_data:
